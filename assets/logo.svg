<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Temple">
  <defs>
    <linearGradient id="bg" x1="36" y1="24" x2="220" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#262A38"/>
      <stop offset="1" stop-color="#10121A"/>
    </linearGradient>
    <linearGradient id="gold" x1="128" y1="48" x2="128" y2="212" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FBC65E"/>
      <stop offset="0.55" stop-color="#F0883E"/>
      <stop offset="1" stop-color="#E2592C"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(74 60) rotate(58) scale(190)">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- badge -->
  <rect x="12" y="12" width="232" height="232" rx="56" fill="url(#bg)"/>
  <rect x="12.5" y="12.5" width="231" height="231" rx="55.5" fill="url(#sheen)" stroke="#FFFFFF" stroke-opacity="0.07"/>

  <!-- temple, drawn in the gold gradient -->
  <g fill="url(#gold)">
    <!-- pediment (roof) -->
    <path d="M128 50 L206 102 H50 Z"/>
    <!-- architrave -->
    <rect x="52" y="106" width="152" height="13" rx="3"/>
    <!-- four capped columns -->
    <g>
      <rect x="69"  y="123" width="22" height="8" rx="2"/>
      <rect x="72"  y="131" width="16" height="46"/>
      <rect x="69"  y="177" width="22" height="8" rx="2"/>

      <rect x="101" y="123" width="22" height="8" rx="2"/>
      <rect x="104" y="131" width="16" height="46"/>
      <rect x="101" y="177" width="22" height="8" rx="2"/>

      <rect x="133" y="123" width="22" height="8" rx="2"/>
      <rect x="136" y="131" width="16" height="46"/>
      <rect x="133" y="177" width="22" height="8" rx="2"/>

      <rect x="165" y="123" width="22" height="8" rx="2"/>
      <rect x="168" y="131" width="16" height="46"/>
      <rect x="165" y="177" width="22" height="8" rx="2"/>
    </g>
    <!-- two-step stylobate -->
    <rect x="48" y="188" width="160" height="12" rx="3"/>
    <rect x="38" y="202" width="180" height="13" rx="4"/>
  </g>
</svg>
